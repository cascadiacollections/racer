name: godot-templates

# Builds racer's stripped Godot Android engine from source
# (docs/godot-templates.md) and publishes it as the prerelease
# godot-templates-<godot version>-<key>, where the key hashes every build
# input (tools/godot_template.py key). Release exports use the build
# tools/godot_templates.lock.json names, checked against its sha256; this
# workflow never changes what ships by itself, a reviewed change to the lock
# file does.
#
# It runs when an input changes on main, or by hand. A hand run on another
# branch builds (to try a profile) but never publishes. A build is tens of
# minutes; nothing on a pull request waits for it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/godot_build_profile.json
      - tools/godot_template.py
      - .github/workflows/godot-templates.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. Only `publish` writes, and it runs no build code: it
# signs and uploads what the build job produced, so the OIDC token never
# reaches SCons or Godot's build scripts.
permissions:
  contents: read

jobs:
  key:
    name: key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      tag: ${{ steps.key.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: key
        id: key
        run: |
          set -eu
          key=$(python3 tools/godot_template.py key)
          version=$(sed -n 's/^GODOT_VERSION = "\(.*\)"$/\1/p' tools/godot_template.py)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "tag=godot-templates-$version-$key" >> "$GITHUB_OUTPUT"
      # A published build is never replaced: the lock file pins its hash.
      - name: already published?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.key.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; nothing to build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (android arm64)
    needs: key
    if: needs.key.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv runs the SCons version the script pins.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: false
      # ANDROID_HOME comes with the runner image; Godot's build installs the
      # NDK version it pins (platform/android/detect.py) with sdkmanager.
      - name: build
        run: python3 tools/godot_template.py build --src "$RUNNER_TEMP/godot"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-template-android
          path: build/godot-templates/libgodot.android.template_release.arm64.so
          if-no-files-found: error

  # Only main publishes: `lock --release` trusts a build only if its
  # attestation names this workflow on refs/heads/main.
  publish:
    name: publish
    needs: [key, build]
    if: needs.key.outputs.exists != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release and upload its files
      id-token: write      # OIDC token for the Sigstore signing certificate
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: godot-template-*
          merge-multiple: true
          path: dist
      - name: checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.key.outputs.tag }}
        run: |
          set -eu
          cd dist
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Godot Android engine ($TAG)" \
            --notes "racer's stripped Godot Android engine, built from source by the godot-templates workflow at ${GITHUB_SHA::7}. Not a game release. Exports use it only once tools/godot_templates.lock.json pins this hash (docs/godot-templates.md)."
          {
            echo "### Published $TAG"
            echo
            echo "Pin it: \`python3 tools/godot_template.py lock --release\` on this commit, then open a pull request with the lock file."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
