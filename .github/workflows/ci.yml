name: ci

on:
  # Only main on push. Without the branch filter a pull request branch runs
  # the whole matrix twice for every commit -- once for push, once for
  # pull_request.
  push:
    branches: [main]
  pull_request:

# Superseded runs are not worth paying for; a new push to the same ref makes
# the one in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The sim crate must build and test with no engine present, on every
  # platform we ship to.
  sim:
    name: sim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      - name: test racer-sim (headless, no Godot installed)
        run: cargo nextest run -p racer-sim --profile ci
      - name: doctests
        run: cargo test --doc --workspace
      - name: build the GDExtension
        run: cargo build -p racer-godot
      # The renderer, the projection, touch and the game core are
      # engine-free and tested without Godot; the golden frame digests must
      # agree on every platform.
      - name: test racer-godot (no Godot installed)
        run: cargo test -p racer-godot
      - name: determinism digest
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
        run: |
          cargo run --release -q -p racer-sim --bin determinism | tee digest.txt
          grep -oE 'digest: 0x[0-9a-f]+' digest.txt | cut -d' ' -f2 > "digest-$PLATFORM.txt"
          cat "digest-$PLATFORM.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt

  # Android: the determinism corpus on a real Android userland (bionic). An
  # arm64 emulator on an x86_64 host is unaccelerated and far too slow, so
  # this runs the x86_64-linux-android build on an x86_64 emulator; the arm64
  # build the APK ships is checked on a phone with `just android-digest`
  # (NOTES.md). Ported from Salt Line's `sim-android`. Only the
  # dependency-free sim crate is built, so there is no rust-cache here.
  sim-android:
    name: sim (android x86_64 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - name: build the determinism check for Android (x86_64)
        run: |
          set -eu
          rustup target add x86_64-linux-android
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cargo build --release -q -p racer-sim --bin determinism --target x86_64-linux-android \
            --config "target.x86_64-linux-android.linker=\"$bin/x86_64-linux-android24-clang\""
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The action runs each line of `script` on its own through sh, so the
      # whole check is one line that writes to a file; the next step reads it.
      # aosp_atd is the headless test image, the quickest to boot.
      - name: determinism digest (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: false
          script: bash tools/android_digest.sh target/x86_64-linux-android/release/determinism > digest.txt
      # Shown even when the run failed: its summary went to the file.
      - name: show the emulator's output
        if: always()
        run: cat digest.txt || true
      - name: extract the digest
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^os: *android$' digest.txt
          grep -oE 'digest: 0x[0-9a-f]+' digest.txt | cut -d' ' -f2 > digest-android-x86_64.txt
          cat digest-android-x86_64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-android-x86_64
          path: digest-android-x86_64.txt

  # The same 200 runs must reach the same digest on every platform: the OS
  # matrix and the Android emulator (iOS joins once the game ships there).
  determinism:
    name: determinism across platforms
    needs: [sim, sim-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - name: compare digests
        run: |
          set -eu
          found=0
          for f in digest-*.txt; do
            printf '%-28s %s\n' "$f" "$(cat "$f")"
            # Count only a well-formed digest, so an empty or garbled file
            # can't pass as a platform that agrees.
            if grep -qxE '0x[0-9a-f]{16}' "$f"; then
              found=$((found + 1))
            else
              echo "malformed digest in $f" >&2
            fi
          done
          # One per `sim` matrix entry plus `sim-android`; keep in step.
          if [ "$found" -ne 4 ]; then
            echo "expected 4 platform digests, got $found" >&2
            exit 1
          fi
          if [ "$(cat digest-*.txt | sort -u | wc -l)" -ne 1 ]; then
            echo "DETERMINISM LEAK: platform digests differ" >&2
            exit 1
          fi
          echo "all platforms agree: $(cat digest-ubuntu-latest.txt)"

  # DESIGN §2.4: every generated track is proven drivable, and the batch
  # gate holds: no unvalidated tracks, at most 2% fallbacks, and a human
  # run failure rate inside its band. The run is deterministic, so it never
  # flakes; if a trip was intended, re-centre the band and say why in
  # NOTES.md.
  solvability:
    name: batch solvability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 1,800 tracks across 200 run seeds
        run: cargo run --release -q -p racer-sim --bin batch -- --seeds 200

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: the sim crate must stay dependency-free
        run: |
          set -eu
          # DESIGN §6: racer-sim depends on nothing. If this ever needs to
          # change it is a conversation, not a commit.
          deps=$(cargo tree -p racer-sim --edges normal --prefix none \
                 | grep -v '^racer-sim' | sort -u || true)
          if [ -n "$deps" ]; then
            echo "racer-sim grew dependencies:" >&2
            echo "$deps" >&2
            exit 1
          fi
          echo "racer-sim has no dependencies"

  hygiene:
    name: typos + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
      # docs/godot-templates.md: a lock that no longer matches the build
      # inputs (or pins nothing) means Android release exports fall back to
      # the official 71 MB engine. That is a warning on every run, so it is
      # never silent; a lock written from a local build fails.
      - name: stripped engine lock
        run: python3 tools/godot_template.py check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
