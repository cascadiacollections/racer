name: ci

on:
  # Only main on push. Without the branch filter a pull request branch runs
  # the whole matrix twice for every commit -- once for push, once for
  # pull_request.
  push:
    branches: [main]
    # Skip documentation-only changes. NOTES.md stays covered: the golden-run
    # test reads it with include_str!.
    paths:
      - '**'
      - '!**/*.md'
      - 'NOTES.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'NOTES.md'

# Superseded runs are not worth paying for; a new push to the same ref makes
# the one in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only `dev release` (pushes to main) writes: it
# replaces the `dev` prerelease and attests what it publishes, and it runs no
# build code, so the OIDC token never reaches Godot, Gradle or a build script.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Godot editor and export templates the android job installs; keep in
  # step with GODOT_VERSION in tools/godot_template.py.
  GODOT_VERSION: 4.7.2

jobs:
  # The sim crate must build and test with no engine present, on every
  # platform we ship to.
  sim:
    name: sim (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS bills at 10x Linux on this private repo. Pull requests run
        # Linux and Windows; pushes to main add macOS, so an Apple-only
        # determinism leak still turns main red before anything ships.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      - name: test racer-sim (headless, no Godot installed)
        run: cargo nextest run -p racer-sim --profile ci
      - name: doctests
        run: cargo test --doc --workspace
      - name: build the GDExtension
        run: cargo build -p racer-godot
      # The renderer, the projection, touch and the game core are
      # engine-free and tested without Godot; the golden frame digests must
      # agree on every platform.
      - name: test racer-godot (no Godot installed)
        run: cargo test -p racer-godot
      - name: determinism digest
        shell: bash
        env:
          PLATFORM: ${{ matrix.os }}
        run: |
          cargo run --release -q -p racer-sim --bin determinism | tee digest.txt
          grep -oE 'digest: 0x[0-9a-f]+' digest.txt | cut -d' ' -f2 > "digest-$PLATFORM.txt"
          cat "digest-$PLATFORM.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt

  # Android: the determinism corpus on a real Android userland (bionic). An
  # arm64 emulator on an x86_64 host is unaccelerated and far too slow, so
  # this runs the x86_64-linux-android build on an x86_64 emulator; the arm64
  # build the APK ships is checked on a phone with `just android-digest`
  # (NOTES.md). Ported from Salt Line's `sim-android`. Only the
  # dependency-free sim crate is built, so there is no rust-cache here.
  sim-android:
    name: sim (android x86_64 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - name: build the determinism check for Android (x86_64)
        run: |
          set -eu
          rustup target add x86_64-linux-android
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cargo build --release -q -p racer-sim --bin determinism --target x86_64-linux-android \
            --config "target.x86_64-linux-android.linker=\"$bin/x86_64-linux-android24-clang\""
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The action runs each line of `script` on its own through sh, so the
      # whole check is one line that writes to a file; the next step reads it.
      # aosp_atd is the headless test image, the quickest to boot.
      - name: determinism digest (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          disable-animations: false
          script: bash tools/android_digest.sh target/x86_64-linux-android/release/determinism > digest.txt
      # Shown even when the run failed: its summary went to the file.
      - name: show the emulator's output
        if: always()
        run: cat digest.txt || true
      - name: extract the digest
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^os: *android$' digest.txt
          grep -oE 'digest: 0x[0-9a-f]+' digest.txt | cut -d' ' -f2 > digest-android-x86_64.txt
          cat digest-android-x86_64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-android-x86_64
          path: digest-android-x86_64.txt

  # The same 200 runs must reach the same digest on every platform: the OS
  # matrix and the Android emulator (iOS joins once the game ships there).
  determinism:
    name: determinism across platforms
    needs: [sim, sim-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      - name: compare digests
        env:
          # One per `sim` matrix entry plus `sim-android`; pull requests skip macOS.
          EXPECTED: ${{ github.event_name == 'pull_request' && 3 || 4 }}
        run: |
          set -eu
          found=0
          for f in digest-*.txt; do
            printf '%-28s %s\n' "$f" "$(cat "$f")"
            # Count only a well-formed digest, so an empty or garbled file
            # can't pass as a platform that agrees.
            if grep -qxE '0x[0-9a-f]{16}' "$f"; then
              found=$((found + 1))
            else
              echo "malformed digest in $f" >&2
            fi
          done
          # One per `sim` matrix entry plus `sim-android`; keep in step.
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "expected $EXPECTED platform digests, got $found" >&2
            exit 1
          fi
          if [ "$(cat digest-*.txt | sort -u | wc -l)" -ne 1 ]; then
            echo "DETERMINISM LEAK: platform digests differ" >&2
            exit 1
          fi
          echo "all platforms agree: $(cat digest-ubuntu-latest.txt)"

  # DESIGN §2.4: every generated track is proven drivable, and the batch
  # gate holds: no unvalidated tracks, at most 2% fallbacks, and a human
  # run failure rate inside its band. The run is deterministic, so it never
  # flakes; if a trip was intended, re-centre the band and say why in
  # NOTES.md.
  solvability:
    name: batch solvability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: 1,800 tracks across 200 run seeds
        run: cargo run --release -q -p racer-sim --bin batch -- --seeds 200

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: the sim crate must stay dependency-free
        run: |
          set -eu
          # DESIGN §6: racer-sim depends on nothing. If this ever needs to
          # change it is a conversation, not a commit.
          deps=$(cargo tree -p racer-sim --edges normal --prefix none \
                 | grep -v '^racer-sim' | sort -u || true)
          if [ -n "$deps" ]; then
            echo "racer-sim grew dependencies:" >&2
            echo "$deps" >&2
            exit 1
          fi
          echo "racer-sim has no dependencies"

  hygiene:
    name: typos + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - name: workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
      # docs/godot-templates.md: a lock that no longer matches the build
      # inputs (or pins nothing) means Android release exports fall back to
      # the official 71 MB engine. That is a warning on every run, so it is
      # never silent; a lock written from a local build fails.
      - name: stripped engine lock
        run: python3 tools/godot_template.py check
      # The sounds are generated (tools/gen_audio.py); a committed file that
      # the generator no longer makes is a hand edit or a stale run.
      - name: generated audio is up to date
        run: python3 tools/gen_audio.py --check
      # tools/ is standard library only, so there is no lockfile to pin ty in;
      # the exact version here keeps new ty releases from failing unrelated PRs.
      - name: type check the Python tools
        run: pipx run ty==0.0.91 check --output-format github tools
      # The 4.8 trial must keep refusing to move the 4.7.2 pin, and its CI
      # job must stay allow-failure. No download.
      - name: godot 4.8 trial pin
        run: python3 tools/godot_48_trial.py self-test

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # The Android release APK (arm64), on every pull request and push to main;
  # only main publishes it (`dev release`). A Gradle export: Godot's official
  # 4.7.2 build template (android_source.zip, which links the device_power
  # Kotlin AAR) with racer's stripped engine swapped into its release AAR
  # (docs/godot-templates.md). The same steps as `just android-template` and
  # `just android-apk release`, spelled out so main can insist on the
  # stripped engine. Ported from Salt Line's `android` job.
  android:
    name: android (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Pushes to main run in the `release` environment, which may hold the
    # Android release key; pull requests never do, and stay on the debug key.
    # An empty name means no environment at all.
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'release' || '' }}
    outputs:
      signing: ${{ steps.key.outputs.mode }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      # The Gradle build wants JDK 17 or newer; 21 is what the Justfile uses.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      # The runner image's newest NDK (local builds use whichever NDK the SDK
      # has; any r24+ links API 24).
      - name: build the GDExtension for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          cargo build --release -p racer-godot --target aarch64-linux-android \
            --config "target.aarch64-linux-android.linker=\"$bin/aarch64-linux-android24-clang\""
          "$bin/llvm-strip" --strip-debug target/aarch64-linux-android/release/libracer_godot.so
      # The editor loads the host library, not the Android one; without it the
      # extension fails to load and import hits godotengine/godot#111048
      # (tools/godot_headless.sh).
      - name: build the GDExtension for the editor
        run: cargo build -p racer-godot
      # The official Gradle template into android/build, then the engine the
      # lock pins into its release AAR, fetched from the godot-templates
      # release and checked against its sha256. A stale or empty lock falls
      # back to the official engine with a warning on pull requests and fails
      # on main. The repository variable STRIPPED_ENGINE=off is the off
      # switch: the official engine everywhere, main included.
      - name: Gradle template and stripped engine
        env:
          GH_TOKEN: ${{ github.token }}
          IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          STRIPPED_ENGINE: ${{ vars.STRIPPED_ENGINE }}
        run: |
          set -eu
          set --
          if [ "$IS_MAIN" = "true" ] && [ "$STRIPPED_ENGINE" != "off" ]; then set -- --require; fi
          python3 tools/godot_template.py prepare-android "$@"
      - name: import assets
        run: bash tools/godot_headless.sh --frame-delay 800 --import
      # Godot's CLI cannot override the version, so the preset is edited in
      # place in this throwaway checkout: versionName <preset>-dev.<run>,
      # versionCode the run number, so each build upgrades the last with
      # `adb install -r` (when signed with the same key).
      - name: version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          base=$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)
          test -n "$base"
          name="$base-dev.$RUN_NUMBER"
          sed -i -e "s/^version\/code=.*/version\/code=$RUN_NUMBER/" \
                 -e "s/^version\/name=.*/version\/name=\"$name\"/" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: signing key
        id: key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          # Only main pushes ask for the release key, and only they run in the
          # `release` environment.
          RELEASE_KEYSTORE_B64: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && (secrets.ANDROID_RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_RELEASE_KEYSTORE) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.ANDROID_RELEASE_KEY_ALIAS || '' }}
        run: |
          set -eu
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            ks="$RUNNER_TEMP/release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$ks"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "signing with the release key"
            exit 0
          fi
          ks="$RUNNER_TEMP/debug.keystore"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "signing with the debug key (ANDROID_DEBUG_KEYSTORE)"
          else
            # A new key every run: each build installs only after the last
            # is uninstalled.
            echo "::warning::neither the ANDROID_RELEASE_KEYSTORE secrets nor ANDROID_DEBUG_KEYSTORE are set; signing with a throwaway key"
            keytool -genkeypair -keystore "$ks" -alias androiddebugkey -storepass android \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=throwaway" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
          } >> "$GITHUB_ENV"
      - name: export the APK
        env:
          # Kept out of GITHUB_ENV so the password lives only in this step.
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.key.outputs.mode == 'release' && secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD || 'android' }}
        run: |
          set -eu
          # Godot takes the SDK from ANDROID_HOME and the JDK from JAVA_HOME.
          mkdir -p build dist
          touch build/.gdignore
          bash tools/godot_headless.sh --export-release "Android" build/racer.apk
          test -s build/racer.apk
          cp build/racer.apk dist/Racer-android-arm64.apk
          ls -l dist
      # The certificate digest decides whether this APK installs over an
      # existing one; print it so a key mix-up is visible in the log. The
      # manifest must name the device_power plugin, or the Kotlin AAR was not
      # bundled and the game falls back to JavaClassWrapper (60 fps cap).
      - name: check the APK
        run: |
          set -eu
          apk=dist/Racer-android-arm64.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | head -1
          "$tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          if ! grep -q 'org.godotengine.plugin.v2.DevicePowerAndroid' "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::the APK's manifest does not register the DevicePowerAndroid plugin"
            exit 1
          fi
          echo "manifest registers org.godotengine.plugin.v2.DevicePowerAndroid"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/|\.dex$'
          if unzip -l "$apk" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::the APK carries a non-arm64 ABI"
            exit 1
          fi
          {
            echo "### Android APK"
            echo
            echo "\`$(stat -c %s "$apk")\` bytes, $("$tools/aapt2" dump badging "$apk" | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # Opt-in Godot 4.8-beta2 trial (docs/godot-48-trial.md). continue-on-error
  # so a preview breakage cannot fail the workflow or the dev release.
  # env.GODOT_VERSION above stays 4.7.2; this job does not install that
  # editor. It is not in dev-release's needs.
  godot-48-trial:
    name: godot 4.8-beta2 trial (allow failure)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/racer/godot-trial
          key: godot-trial-${{ hashFiles('tools/godot_48_trial.py') }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable  # the pinned channel still comes from rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: godot-48-trial
      - name: trial (api-4-7 extension on the 4.8-beta2 editor)
        run: python3 tools/godot_48_trial.py run

  # Replaces the `dev` prerelease with this commit's APK, so the latest main
  # is one download away on a phone. Only after every check has passed.
  dev-release:
    name: dev release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [determinism, solvability, lint, hygiene, deny, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the GitHub release and upload its files
      id-token: write      # OIDC token for the Sigstore signing certificate
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum -- * > SHA256SUMS
          ls -l
          cat SHA256SUMS
      # The repository variable ATTEST=off skips it, should the plan ever
      # lose attestations for private repositories.
      - name: attest build provenance
        if: vars.ATTEST != 'off'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ needs.android.outputs.signing }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          case "$SIGNING" in
            release) key="the release key (ANDROID_RELEASE_KEYSTORE)" ;;
            debug) key="the CI debug key (ANDROID_DEBUG_KEYSTORE), not the release key" ;;
            *) key="a throwaway key made for this run: uninstall the previous build before installing it" ;;
          esac
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Latest main, built from $short: Racer $VERSION for Android (arm64), for testing only.

          Signed with $key. Builds signed with the same key upgrade each other (\`adb install -r\`); switching keys (or from a local \`just android\` build) needs an uninstall first, which deletes the app's data.

          Verify the download against SHA256SUMS, or its provenance with \`gh attestation verify Racer-android-arm64.apk --repo $GITHUB_REPOSITORY\`.
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          cd dist
          gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create dev ./* \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Development build ($short)" \
            --notes-file "$RUNNER_TEMP/notes.md"
