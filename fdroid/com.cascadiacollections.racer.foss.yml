# Draft F-Droid recipe. Not submitted.
# Replace commit with the full hash of the v0.1.0 tag before sending this.
# F-Droid signs the APK. This project does not sign it, and reproducible
# builds are not used.

Categories:
  - Action Game
License: MIT
AuthorName: Cascadia Collections
SourceCode: https://github.com/cascadiacollections/racer
IssueTracker: https://github.com/cascadiacollections/racer/issues

AutoName: Racer

RepoType: git
Repo: https://github.com/cascadiacollections/racer.git

Builds:
  - versionName: 0.1.0
    versionCode: 1009999
    commit: REPLACE_WITH_FULL_COMMIT_HASH_OF_THE_v0.1.0_TAG
    timeout: 14400
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++ rustup libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev
    output: output.apk
    srclibs:
      - Godot@4.7.2-stable
    scandelete:
      - addons/device_power/bin
    build:
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_NDK_HOME=$$NDK$$
      - export ANDROID_HOME=$$SDK$$
      - export ANDROID_SDK_ROOT=$$SDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export RUSTUP_TOOLCHAIN=1.99.0
      - rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
      - cargo build -p racer-godot --locked
      - cargo ndk --platform 24 -t arm64-v8a build --release --locked -p racer-godot
      - $$NDK$$/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-debug target/aarch64-linux-android/release/libracer_godot.so
      - pushd $$Godot$$
      - export SCONS="scons -j `nproc` verbose=no warnings=no progress=no"
      - export COMMON_OFF="module_webrtc_enabled=no module_webxr_enabled=no module_websocket_enabled=no module_jsonrpc_enabled=no module_enet_enabled=no module_upnp_enabled=no module_theora_enabled=no module_mp3_enabled=no module_tinyexr_enabled=no module_noise_enabled=no module_interactive_music_enabled=no module_camera_enabled=no module_visual_shader_enabled=no"
      - export EDITOR_OFF="disable_xr=yes module_jolt_physics_enabled=no module_godot_physics_3d_enabled=no module_navigation_3d_enabled=no module_raycast_enabled=no module_lightmapper_rd_enabled=no module_csg_enabled=no module_gridmap_enabled=no module_vhacd_enabled=no module_xatlas_unwrap_enabled=no module_gltf_enabled=no module_fbx_enabled=no module_objectdb_profiler_enabled=no"
      - $SCONS target=editor platform=linuxbsd $COMMON_OFF $EDITOR_OFF
      - $SCONS target=template_release platform=android arch=arm64 production=yes swappy=no generate_android_binaries=yes generate_apk=yes
      - popd
      - mv $$Godot$$/bin/android_release.apk ./android_release.apk
      - mkdir -p .godot
      - echo res://racer.gdextension > .godot/extension_list.cfg
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --path . --import || [ $? -eq 139 ]
      - export GODOT_CFG=$(ls ~/.config/godot/editor_settings-*.tres)
      - sed -i -e "s|^export/android/java_sdk_path.*|export/android/java_sdk_path = \"$JAVA_HOME\"|" $GODOT_CFG
      - sed -i -e 's|^export/android/android_sdk_path.*|export/android/android_sdk_path = "$$SDK$$"|' $GODOT_CFG
      - grep -q '^export/android/java_sdk_path' $GODOT_CFG || echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> $GODOT_CFG
      - grep -q '^export/android/android_sdk_path' $GODOT_CFG || echo 'export/android/android_sdk_path = "$$SDK$$"' >> $GODOT_CFG
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --path . --export-release "F-Droid" output.apk
    ndk: 29.0.14206865

MaintainerNotes: |-
  Godot 4.7.2 project with a Rust GDExtension (crates/racer-godot, gdext
  0.5, api-4-7). Engine (Linux editor and the arm64 Android release
  template) and the extension are built from source. The export uses the
  scons-built android_release.apk as the custom template of the "F-Droid"
  export preset (package/signed=false), so F-Droid signs the result.
  Recipe follows org.seishingakuen.shougibu (same Godot version, Rust
  GDExtension, cargo-ndk).

  Non-Gradle export on purpose. The Gradle preset bundles the
  addons/device_power Kotlin plugin as a prebuilt AAR, which the scanner
  rejects (scandelete). Without the AAR the addon falls back to its
  JavaClassWrapper backend, which needs no Java code.

  The editor needs the host-built GDExtension (cargo build -p racer-godot,
  debug) to import the project. The extension is listed in
  .godot/extension_list.cfg first and exit code 139 is tolerated, as
  upstream's tools/godot_headless.sh does for godotengine/godot#111048.

  Upstream's own Android builds use a stripped engine (tools/godot_build_profile.json),
  which works because the godot crate has lazy-function-tables on. This
  recipe builds the full engine instead.

  Application ID: the "F-Droid" export preset uses
  com.cascadiacollections.racer.foss, so this build installs next to (and never
  collides with) the store builds com.cascadiacollections.racer and
  com.cascadiacollections.racer.shareware. F-Droid signs the APK; upstream
  does not sign it and reproducible builds are not used (owner decision).

  Edition: full (no "shareware" custom feature). The edition difference
  lives only in crates/racer-godot/src/tier.rs.

  Audio is generated by tools/gen_audio.py (committed output, byte-for-byte
  reproducible). The art is drawn in code.

