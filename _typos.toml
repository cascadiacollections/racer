# typos (https://github.com/crate-ci/typos). Snapshot files are generated hex
# digests and track strips, not prose; the golden-run corpus is input logs.
[files]
extend-exclude = ["*.snap", "golden_runs.txt", "proptest-regressions/", "*.proptest-regressions"]

[default]
# Layout codes (DESIGN §9.5) are base32, not words.
extend-ignore-re = ['"[0-9A-Z]{30,}"']

[default.extend-words]
# A right-hander or left-hander is a bend, not a misspelt handler.
hander = "hander"
