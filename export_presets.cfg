; Linux for desktop testing and Android (arm64) for phones, both on the
; official Godot 4.7.2 export templates. Android is a Gradle build (run
; `just android-template` once): it bundles the device_power addon's Kotlin
; plugin, and release exports carry the stripped engine the lock pins
; (docs/godot-templates.md). Debug exports sign with
; the editor's debug keystore (export/android/debug_keystore in the editor
; settings, or GODOT_ANDROID_KEYSTORE_DEBUG_PATH); the Justfile signs
; release exports with the same key so they install over each other.
